        { minute: "68", desc: "Try, Snyman (SA)", state: F.present },
        { minute: "77", desc: "Try, Marx (SA)", state: F.present }
      ],
      sentiment: {
        source: "reddit",
        badgeText: "Fan mood — computed by this site from r/rugbyunion match thread",
        buckets: [
          { name: "Pre-match", label: "Upbeat", score: 0.3 },
          { name: "1st half", label: "Euphoric", score: 0.8 },
          { name: "2nd half", label: "Euphoric", score: 0.75 },
          { name: "Post-match", label: "Euphoric", score: 0.85 }
        ]
      },
      wikipediaUrl: "https://en.wikipedia.org/wiki/2024_Rugby_Championship",
      methodUrl: "#/method",
      sourceThreadUrl: "https://www.reddit.com/r/rugbyunion/"
    },

    drawSample: {
      id: "drawSample",
      date: "2019-11-02",
      opponent: "Wales",
      competition: "Test match",
      venue: field("Principality Stadium, Cardiff", F.present),
      decade: "2010s",
      scoreFor: 19, scoreAgainst: 19, result: "D",
      note: "(sample data — fabricated for demonstrating the draw colour/state; not a real result)",
      referee: field(null, F.failed),
      kickoff: field("14:00 GMT", F.present),
      lineups: { sa: [field(null, F.loading)], opp: [field(null, F.loading)] },
      events: [{ minute: "—", desc: "Event feed temporarily unavailable", state: F.failed }],
      // D2 minimum-volume floor: below 25 comments the mood layer refuses to score
      sentiment: {
        source: "reddit",
        badgeText: "Fan mood — computed by this site from r/rugbyunion match thread",
        tooFew: true, commentCount: 11
      },
      wikipediaUrl: "https://en.wikipedia.org/wiki/History_of_South_Africa_national_rugby_union_team"
    }
  };

  var historyRows = ["era1896", "rwc1995", "rwc2007", "y2015semi", "rc2024", "drawSample"];

  var upcomingFixtures = [
    { opponent: "Wales", competition: "Autumn internationals", date: "2026-11-14", venue: "Principality Stadium, Cardiff", status: "postponed" },
    { opponent: "Italy", competition: "Autumn internationals", date: "2026-11-21", venue: "Stadio Olimpico, Rome (TBD)", status: "tbd" }
  ];

  var nextFixtureInSeason = {
    opponent: "All Blacks", competition: "Rugby Championship", date: "2026-08-15",
    kickoff: "17:10 SAST", venue: "Twickenham Stadium, London",
    note: "vs All Blacks — (sample data)"
  };
  // Off-season card shows last result ONLY — no predictive "next window"
  // note (PRD D30: an unsourced prediction is what this site exists to not do)
  var nextFixtureOffSeasonNote = {
    lastResult: "SA 27–13 NZ"
  };

  // ---------------------------------------------------------------------
  // Rendering helpers
  // ---------------------------------------------------------------------

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderField(f, fallbackLabel) {
    if (!f) return '<span class="field-absent">not recorded</span>';
    if (f.state === F.present) return escapeHtml(f.value);
    if (f.state === F.absent) return '<span class="field-absent">' + (fallbackLabel || "not recorded") + "</span>";
    if (f.state === F.loading) return '<span class="field-loading" title="not yet fetched"></span>';
    if (f.state === F.failed) return '<span class="badge failed">&#9888; temporarily unavailable</span>';
    return "";
  }

  function wldClass(result) { return result === "W" ? "win" : result === "L" ? "loss" : "draw"; }

  function attributionFooter(m) {
    return '<div class="footer-attrib">' +
      "Match data adapted from " +
      '<a href="' + m.wikipediaUrl + '" target="_blank" rel="noopener">Wikipedia</a>, ' +
      'licensed <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>. ' +
      "Modified: parsed and normalised from wikitext." +
      "</div>";
  }

  function computedBadge(sentiment) {
    if (!sentiment) return "";
    return '<div class="badge computed" style="margin-bottom:var(--sp-2)">' +
      '<span class="dot"></span> computed</div>' +
      '<p class="note" style="margin-top:0">' + escapeHtml(sentiment.badgeText) +
      ' &middot; <a href="#/method">method</a> &middot; <a href="' +
      (sentiment.source === "reddit" ? "https://www.reddit.com/r/rugbyunion/" : "https://www.theguardian.com/sport/rugby-union") +
      '" target="_blank" rel="noopener">source</a></p>';
  }

  // ---------------------------------------------------------------------
  // Page: Home (J1, J2)
  // ---------------------------------------------------------------------

  var seasonMode = "in-season"; // toggled by button, demonstrates D8 off-season variant

  function renderHome() {
    var fixtureCardHtml;
    if (seasonMode === "in-season") {
      fixtureCardHtml =
        '<h3>Next fixture</h3>' +
        '<div style="font-size:var(--fs-400);font-weight:700">South Africa vs ' + nextFixtureInSeason.opponent + '</div>' +
        '<div class="meta-row"><span>' + nextFixtureInSeason.competition + '</span><span>' + nextFixtureInSeason.date + '</span><span>' + nextFixtureInSeason.kickoff + '</span><span>' + nextFixtureInSeason.venue + '</span></div>' +
        '<p class="note">' + nextFixtureInSeason.note + '</p>';
    } else {
      fixtureCardHtml =
        '<h3>Next fixture</h3>' +
        '<div style="font-size:var(--fs-400);font-weight:700">No test scheduled</div>' +
        '<div class="meta-row"><span>Last result: ' + nextFixtureOffSeasonNote.lastResult + '</span></div>';
    }

    var latest = matches.rc2024;
    var upcomingHtml = upcomingFixtures.map(function (f) {
      var chip = f.status === "postponed"
        ? '<span class="badge tbd">postponed</span>'
        : f.status === "tbd" ? '<span class="badge tbd">TBD</span>' : "";
      return '<div class="meta-row" style="margin-bottom:var(--sp-2)">' +
        '<span>' + f.date + '</span><span>vs ' + f.opponent + '</span><span>' + f.competition + '</span> ' + chip + '</div>';
    }).join("");

    document.getElementById("app").innerHTML =
      '<h1>Springbok Tracking</h1>' +
      '<p class="lede">J1 &amp; J2 — the next fixture and the latest result should answer themselves above the fold.</p>' +
      '<div class="card-row">' +
        '<div class="card">' + fixtureCardHtml +
          '<button class="toggle-btn" id="season-toggle" style="margin-top:var(--sp-3)">Toggle off-season variant (D8)</button>' +
        '</div>' +
        '<div class="card">' +
          '<div class="result-bar ' + wldClass(latest.result) + '"></div>' +
          '<h3>Latest result</h3>' +
          '<div style="font-size:var(--fs-400);font-weight:700">South Africa ' + latest.scoreFor + '&ndash;' + latest.scoreAgainst + ' ' + latest.opponent + '</div>' +
          '<div class="meta-row"><span>' + latest.competition + '</span><span>' + latest.date + '</span></div>' +
          '<p class="note">' + latest.note + '</p>' +
          '<a class="plain" href="#/match/' + latest.id + '"><button class="toggle-btn">Open game detail &rarr;</button></a>' +
        '</div>' +
      '</div>' +

      '<h2>Upcoming fixtures</h2>' +
      '<div class="card">' + upcomingHtml + '</div>' +

      '<h2>Match under way (edge state, D8)</h2>' +
      '<div class="card">' +
        '<div style="font-size:var(--fs-400);font-weight:700">South Africa vs Wales</div>' +
        '<p class="note">Match under way — no live coverage here; result appears after full time.</p>' +
      '</div>';

    var btn = document.getElementById("season-toggle");
    if (btn) btn.addEventListener("click", function () {
      seasonMode = seasonMode === "in-season" ? "off-season" : "in-season";
      renderHome();
    });
  }

  // ---------------------------------------------------------------------
  // Page: History (J3)
  // ---------------------------------------------------------------------

  var historyFilters = { opponent: "all", decade: "all" };

  function renderHistory() {
    var opponents = ["all"].concat(uniq(historyRows.map(function (id) { return matches[id].opponent; })));
    var decades = ["all"].concat(uniq(historyRows.map(function (id) { return matches[id].decade; })));

    function uniq(arr) { var seen = {}; var out = []; arr.forEach(function (x) { if (!seen[x]) { seen[x] = 1; out.push(x); } }); return out; }

    function chipRow(items, key) {
      return items.map(function (v) {
        var sel = historyFilters[key] === v ? "selected" : "";
        return '<span class="chip ' + sel + '" data-filter="' + key + '" data-value="' + escapeHtml(v) + '">' + (v === "all" ? "All " + key + "s" : escapeHtml(v)) + '</span>';
      }).join("");
    }

    var rows = historyRows.filter(function (id) {
      var m = matches[id];
      if (historyFilters.opponent !== "all" && m.opponent !== historyFilters.opponent) return false;
      if (historyFilters.decade !== "all" && m.decade !== historyFilters.decade) return false;
      return true;
    });

    var tableRows = rows.map(function (id) {
      var m = matches[id];
      return '<tr class="row-link" data-id="' + id + '">' +
        '<td data-label="Date">' + m.date + '</td>' +
        '<td data-label="Opponent">vs ' + escapeHtml(m.opponent) + '</td>' +
        '<td data-label="Score">' + m.scoreFor + '&ndash;' + m.scoreAgainst + '</td>' +
        '<td data-label="W/D/L"><span class="wld ' + m.result + '">' + m.result + '</span></td>' +
        '<td data-label="Venue">' + renderField(m.venue) + '</td>' +
        '<td data-label="Competition">' + escapeHtml(m.competition) + '</td>' +
        '</tr>';
    }).join("");

    document.getElementById("app").innerHTML =
      '<h1>History</h1>' +
      '<p class="lede">J3 — find any historic game in a filter and a scroll. Sparse eras (e.g. 1896) render honestly rather than padding columns.</p>' +
      '<div class="chips">' + chipRow(opponents, "opponent") + '</div>' +
      '<div class="chips">' + chipRow(decades, "decade") + '</div>' +
      '<table class="history"><thead><tr><th>Date</th><th>Opponent</th><th>Score</th><th>W/D/L</th><th>Venue</th><th>Competition</th></tr></thead>' +
      '<tbody>' + tableRows + '</tbody></table>' +
      '<div class="footer-attrib">Match data adapted from Wikipedia’s <a href="https://en.wikipedia.org/wiki/List_of_South_Africa_rugby_union_test_matches" target="_blank" rel="noopener">List of South Africa rugby union test matches</a>, licensed <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>.</div>';

    document.querySelectorAll(".chip").forEach(function (chip) {
      chip.addEventListener("click", function () {
        historyFilters[chip.dataset.filter] = chip.dataset.value;
        renderHistory();
      });
    });
    document.querySelectorAll("tr.row-link").forEach(function (tr) {
      tr.addEventListener("click", function () { location.hash = "#/match/" + tr.dataset.id; });
    });
  }

  // ---------------------------------------------------------------------
  // Page: Game detail (J4)
  // ---------------------------------------------------------------------

  function renderDetail(id) {
    var m = matches[id] || matches.rc2024;

    var kickoffHtml = renderField(m.kickoff);
    if (m.kickoff && m.kickoff.sourcesDiffer) {
      var sd = m.kickoff.sourcesDiffer;
      kickoffHtml += ' <span class="badge differ" title="' +
        sd.values.map(function (v) { return v.source + ": " + v.value; }).join(" | ") +
        '">sources differ</span>';
    }

    var lineupsHtml = '<div class="lineups">' +
      '<div class="col"><h3>South Africa</h3><ol>' +
        m.lineups.sa.map(function (p) { return "<li>" + renderField(p) + "</li>"; }).join("") +
      '</ol></div>' +
      '<div class="col"><h3>' + escapeHtml(m.opponent) + '</h3><ol>' +
        m.lineups.opp.map(function (p) { return "<li>" + renderField(p) + "</li>"; }).join("") +
      '</ol></div>' +
    '</div>';

    var eventsHtml = '<ul class="events-list">' +
      m.events.map(function (e) {
        var desc = e.state === F.failed
          ? '<span class="field-failed">&#9888; ' + escapeHtml(e.desc) + '</span>'
          : e.state === F.absent
            ? '<span class="field-absent">' + escapeHtml(e.desc) + '</span>'
            : escapeHtml(e.desc);
        return '<li><span class="min">' + escapeHtml(e.minute) + "'</span>" + desc + "</li>";
      }).join("") +
    '</ul>';

    document.getElementById("app").innerHTML =
      '<div class="detail-header">' +
        '<div>' +
          '<div class="result-bar ' + wldClass(m.result) + '" style="width:80px"></div>' +
          '<div class="score-hero">South Africa ' + m.scoreFor + '&ndash;' + m.scoreAgainst + ' ' + escapeHtml(m.opponent) + '</div>' +
          '<div class="meta-row"><span>' + escapeHtml(m.competition) + '</span><span>' + m.date + '</span><span>' + renderField(m.venue) + '</span></div>' +
        '</div>' +
        '<a class="plain" href="#/match/' + m.id + '/timeline"><button class="toggle-btn">Open timeline &rarr;</button></a>' +
      '</div>' +
      (m.note ? '<p class="note">' + escapeHtml(m.note) + '</p>' : "") +

      '<h2>Officials</h2>' +
      '<div class="card"><h3>Referee</h3>' + renderField(m.referee) + '<h3 style="margin-top:var(--sp-3)">Kickoff time</h3>' + kickoffHtml + '</div>' +

      '<h2>Lineups</h2>' +
      '<div class="card">' + lineupsHtml + '</div>' +

      '<h2>Scoring events</h2>' +
      '<div class="card">' + eventsHtml + '</div>' +

      attributionFooter(m);
  }

  // ---------------------------------------------------------------------
  // Page: Match timeline (J5)
  // ---------------------------------------------------------------------

  function renderTimeline(id) {
    var m = matches[id] || matches.rc2024;

    var maxMinute = Math.max.apply(null, m.events.map(function (e) { return parseInt(e.minute, 10) || 0; }).concat([80]));
    var axisMarkers = m.events.map(function (e) {
      var min = parseInt(e.minute, 10) || 0;
      var pct = Math.min(100, (min / maxMinute) * 100);
      return '<div class="axis-marker" style="left:' + pct + '%"><div class="label">' + escapeHtml(e.minute) + "'</div></div>";
    }).join("");

    var curveHtml;
    if (m.sentiment && m.sentiment.tooFew) {
      curveHtml =
        computedBadge(m.sentiment) +
        '<p class="note">Too little discussion to score &mdash; ' + m.sentiment.commentCount +
        ' comments in the match thread (minimum 25). Events above still tell the story.</p>';
    } else if (m.sentiment) {
      var w = 560, h = 120, pad = 40;
      var n = m.sentiment.buckets.length;
      var pts = m.sentiment.buckets.map(function (b, i) {
        var x = pad + (i * (w - 2 * pad)) / Math.max(1, n - 1);
        var y = h / 2 - b.score * (h / 2 - 10);
        return { x: x, y: y, b: b };
      });
      var poly = pts.map(function (p) { return p.x + "," + p.y; }).join(" ");
      var circles = pts.map(function (p) {
        var color = p.b.score > 0.15 ? "var(--c-mood-pos)" : p.b.score < -0.15 ? "var(--c-mood-neg)" : "var(--c-mood-neutral)";
        return '<circle cx="' + p.x + '" cy="' + p.y + '" r="5" fill="' + color + '" />' +
          '<text x="' + p.x + '" y="' + (h - 4) + '" text-anchor="middle" class="curve-point-label">' + escapeHtml(p.b.name) + '</text>';
      }).join("");
      var labels = pts.map(function (p) {
        return '<div style="flex:1 1 0;text-align:center;font-size:var(--fs-100);color:var(--c-ink-300);padding:0 4px">' + escapeHtml(p.b.label) + '</div>';
      }).join("");

      curveHtml =
        computedBadge(m.sentiment) +
        '<svg class="curve-svg" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMid meet">' +
          '<line x1="' + pad + '" y1="' + (h / 2) + '" x2="' + (w - pad) + '" y2="' + (h / 2) + '" stroke="var(--c-ink-700)" stroke-dasharray="2,3" />' +
          '<polyline points="' + poly + '" fill="none" stroke="var(--c-gold-500)" stroke-width="2" />' +
          circles +
        '</svg>' +
        '<div style="display:flex">' + labels + '</div>';
    } else {
      curveHtml = '<p class="note">No sentiment sources for this era — events-only timeline.</p>';
    }

    document.getElementById("app").innerHTML =
      '<h1>Match timeline</h1>' +
      '<p class="lede">South Africa ' + m.scoreFor + '&ndash;' + m.scoreAgainst + ' ' + escapeHtml(m.opponent) + ' &middot; ' + m.date + '</p>' +

      '<h2>Events</h2>' +
      '<div class="card axis-wrap"><div class="axis-line">' + axisMarkers + '</div></div>' +

      '<h2>Fan mood</h2>' +
      '<div class="card">' + curveHtml + '</div>' +

      '<p><a class="plain" href="#/match/' + m.id + '"><button class="toggle-btn">&larr; Back to game detail</button></a></p>' +

      attributionFooter(m);
  }

  // ---------------------------------------------------------------------
  // Page: /method (PRD §2.5 — the D5 method-link destination)
  // ---------------------------------------------------------------------

  function renderMethod() {
    document.getElementById("app").innerHTML =
      '<h1>How this site works</h1>' +
      '<p class="lede">Every fact links to where it came from. Two bounded exceptions exist, and this page is their explanation.</p>' +
      '<h2>Match facts</h2>' +
      '<div class="card"><p class="note">Scores, lineups, referees and events are parsed from Wikipedia articles ' +
      '(CC BY-SA 4.0) — each page footer links the exact source article. Where history is thin we say ' +
      '&ldquo;not recorded&rdquo; rather than guessing. Fixtures come via API-Sports (named + fetch date shown).</p></div>' +
      '<h2>Fan mood (computed)</h2>' +
      '<div class="card"><p class="note">Mood scores are computed by this site with a public sentiment lexicon over ' +
      'r/rugbyunion match-thread comments (or news headlines where no thread exists). Scores map to five labels: ' +
      'Despair &middot; Grumbling &middot; Mixed &middot; Upbeat &middot; Euphoric. Threads with fewer than 25 comments are not scored. ' +
      'Mood is our inference, never the source&rsquo;s own words &mdash; that&rsquo;s why it always carries the &ldquo;computed&rdquo; badge.</p></div>' +
      '<p><a class="plain" href="#/home"><button class="toggle-btn">&larr; Home</button></a></p>';
  }

  // ---------------------------------------------------------------------
  // Router
  // ---------------------------------------------------------------------

  function setActiveTab(route) {
    document.querySelectorAll("#tabs a").forEach(function (a) {
      a.classList.toggle("active", a.dataset.route === route);
    });
  }

  function route() {
    var hash = location.hash || "#/home";
    var parts = hash.replace(/^#\//, "").split("/");

    if (parts[0] === "home" || parts[0] === "") { setActiveTab("home"); renderHome(); return; }
    if (parts[0] === "method") { setActiveTab("method"); renderMethod(); return; }
    if (parts[0] === "history") { setActiveTab("history"); renderHistory(); return; }
    if (parts[0] === "match" && parts[1] && parts[2] === "timeline") { setActiveTab("timeline"); renderTimeline(parts[1]); return; }
    if (parts[0] === "match" && parts[1]) { setActiveTab("match"); renderDetail(parts[1]); return; }
    setActiveTab("home"); renderHome();
  }

  window.addEventListener("hashchange", route);
  route();
})();
</script>
